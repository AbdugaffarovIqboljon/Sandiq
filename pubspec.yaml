publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2

  #screen_util
  flutter_screenutil: ^5.9.0

  #dio
  dio: ^5.3.4

  #easy_localization
  easy_localization: ^3.0.3

